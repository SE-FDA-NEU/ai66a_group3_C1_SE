<svg xmlns="http://www.w3.org/2000/svg" width="960" height="770" viewBox="0 0 960 770" role="img" aria-labelledby="title desc"><title id="title">Popular movies (P1) wireframe</title><desc id="desc">browse the top ten eligible movies in popularity order.. Authored schematic, not a screenshot or acceptance evidence.</desc><rect width="960" height="770" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#172033"><text x="28" y="32" font-size="15" font-weight="700">M3 / TEAM 03  ·  WIREFRAME — NOT A SCREENSHOT</text><text x="28" y="67" font-size="26" font-weight="700">Popular movies (P1)</text><text x="28" y="95" font-size="17" font-weight="400">/popular · public</text><text x="28" y="126" font-size="17" font-weight="400">The user comes here to browse the top ten eligible movies in popularity order.</text><rect x="24" y="170" width="912" height="412" rx="8" fill="#fff" stroke="#64748b"/><text x="48" y="210" font-size="27" font-weight="700">Popular movies</text><text x="48" y="248" font-size="17" font-weight="400">Browse the highest-ranked movies in the active catalogue.</text><text x="48" y="285" font-size="17" font-weight="400">Movie catalogue · Sign in</text><rect x="48" y="322" width="270" height="170" rx="8" fill="#fff" stroke="#64748b"/><text x="62" y="348" font-size="15" font-weight="400">[Year]</text><text x="62" y="376" font-size="20" font-weight="700">[Movie title]</text><text x="62" y="402" font-size="16" font-weight="400">[Genres]</text><text x="62" y="428" font-size="15" font-weight="400">TMDb popularity [score]</text><text x="62" y="476" font-size="16" font-weight="700">View details</text><rect x="340" y="322" width="270" height="170" rx="8" fill="#fff" stroke="#64748b"/><text x="354" y="348" font-size="15" font-weight="400">[Year]</text><text x="354" y="376" font-size="20" font-weight="700">[Movie title]</text><text x="354" y="402" font-size="16" font-weight="400">[Genres]</text><text x="354" y="428" font-size="15" font-weight="400">TMDb popularity [score]</text><text x="354" y="476" font-size="16" font-weight="700">View details</text><rect x="632" y="322" width="270" height="170" rx="8" fill="#fff" stroke="#64748b"/><text x="646" y="348" font-size="15" font-weight="400">[Year]</text><text x="646" y="376" font-size="20" font-weight="700">[Movie title]</text><text x="646" y="402" font-size="16" font-weight="400">[Genres]</text><text x="646" y="428" font-size="15" font-weight="400">TMDb popularity [score]</text><text x="646" y="476" font-size="16" font-weight="700">View details</text><text x="28" y="608" font-size="17" font-weight="700">API calls (relative local backend paths)</text><text x="28" y="634" font-size="15" font-weight="400">GET /api/movies/popular?limit=10</text><text x="28" y="752" font-size="14" font-weight="400">Schematic labels in [brackets] denote data; verify exact UI wording in docs/ui.md.</text></g></svg>