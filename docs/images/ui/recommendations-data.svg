<svg xmlns="http://www.w3.org/2000/svg" width="960" height="770" viewBox="0 0 960 770" role="img" aria-labelledby="title desc"><title id="title">Recommendations / data wireframe</title><desc id="desc">view recommendations and recover from unavailable data.. Authored schematic, not a screenshot or acceptance evidence.</desc><rect width="960" height="770" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#172033"><text x="28" y="32" font-size="15" font-weight="700">M3 / TEAM 03  ·  WIREFRAME — NOT A SCREENSHOT</text><text x="28" y="67" font-size="26" font-weight="700">Recommendations / data</text><text x="28" y="95" font-size="17" font-weight="400">/recommendations · authenticated</text><text x="28" y="126" font-size="17" font-weight="400">The user comes here to view recommendations and recover from unavailable data.</text><rect x="24" y="170" width="912" height="412" rx="8" fill="#fff" stroke="#64748b"/><text x="48" y="204" font-size="26" font-weight="700">Recommendations</text><text x="620" y="204" font-size="16" font-weight="400">[Current account email]</text><rect x="760" y="216" width="135" height="36" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="772" y="240" font-size="16" font-weight="700">Sign out</text><text x="48" y="244" font-size="17" font-weight="400">Change my genres · Browse the catalogue</text><text x="48" y="290" font-size="23" font-weight="700">Recommended for you</text><text x="48" y="324" font-size="16" font-weight="400">Filter by genre [All genres v]   [Clear filter]   Showing N of M movies</text><rect x="48" y="350" width="270" height="170" rx="8" fill="#fff" stroke="#64748b"/><text x="62" y="376" font-size="15" font-weight="400">[Year]</text><text x="62" y="404" font-size="20" font-weight="700">[Movie title]</text><text x="62" y="430" font-size="16" font-weight="400">[Genres]</text><text x="62" y="456" font-size="15" font-weight="400">TMDb popularity [score]</text><text x="62" y="480" font-size="14" font-weight="400">Matches your genres: [names]</text><text x="62" y="504" font-size="16" font-weight="700">View details</text><rect x="340" y="350" width="270" height="170" rx="8" fill="#fff" stroke="#64748b"/><text x="354" y="376" font-size="15" font-weight="400">[Year]</text><text x="354" y="404" font-size="20" font-weight="700">[Movie title]</text><text x="354" y="430" font-size="16" font-weight="400">[Genres]</text><text x="354" y="456" font-size="15" font-weight="400">TMDb popularity [score]</text><text x="354" y="480" font-size="14" font-weight="400">Matches your genres: [names]</text><text x="354" y="504" font-size="16" font-weight="700">View details</text><rect x="632" y="350" width="270" height="170" rx="8" fill="#fff" stroke="#64748b"/><text x="646" y="376" font-size="15" font-weight="400">[Year]</text><text x="646" y="404" font-size="20" font-weight="700">[Movie title]</text><text x="646" y="430" font-size="16" font-weight="400">[Genres]</text><text x="646" y="456" font-size="15" font-weight="400">TMDb popularity [score]</text><text x="646" y="480" font-size="14" font-weight="400">Matches your genres: [names]</text><text x="646" y="504" font-size="16" font-weight="700">View details</text><text x="28" y="608" font-size="17" font-weight="700">API calls (relative local backend paths)</text><text x="28" y="634" font-size="15" font-weight="400">GET /api/auth/me (guard when identity is unknown)</text><text x="28" y="657" font-size="15" font-weight="400">GET /api/me/recommendations?limit=10 · POST /api/auth/logout</text><text x="28" y="680" font-size="15" font-weight="400">GET /api/genres (filter options, only with a non-empty ready list)</text><text x="28" y="752" font-size="14" font-weight="400">Schematic labels in [brackets] denote data; verify exact UI wording in docs/ui.md.</text></g></svg>