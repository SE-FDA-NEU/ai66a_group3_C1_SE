<svg xmlns="http://www.w3.org/2000/svg" width="960" height="770" viewBox="0 0 960 770" role="img" aria-labelledby="title desc"><title id="title">Movie Preferences wireframe</title><desc id="desc">select, save and revisit 1 to 5 favourite genres.. Authored schematic, not a screenshot or acceptance evidence.</desc><rect width="960" height="770" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#172033"><text x="28" y="32" font-size="15" font-weight="700">M3 / TEAM 03  ·  WIREFRAME — NOT A SCREENSHOT</text><text x="28" y="67" font-size="26" font-weight="700">Movie Preferences</text><text x="28" y="95" font-size="17" font-weight="400">/preferences · authenticated</text><text x="28" y="126" font-size="17" font-weight="400">The user comes here to select, save and revisit 1 to 5 favourite genres.</text><rect x="24" y="170" width="912" height="412" rx="8" fill="#fff" stroke="#64748b"/><text x="48" y="204" font-size="17" font-weight="400">Back to recommendations · Browse the catalogue</text><text x="48" y="246" font-size="26" font-weight="700">Movie Preferences</text><text x="48" y="278" font-size="17" font-weight="400">Choose 1 to 5 favourite genres ... then choose Save preferences.</text><text x="48" y="318" font-size="18" font-weight="700">Favourite genres · [N] of 5 selected</text><rect x="48" y="338" width="270" height="40" rx="8" fill="#fff" stroke="#64748b"/><text x="62" y="365" font-size="17" font-weight="400">[ ] [Canonical genre]</text><rect x="338" y="338" width="270" height="40" rx="8" fill="#fff" stroke="#64748b"/><text x="352" y="365" font-size="17" font-weight="400">[ ] [Canonical genre]</text><rect x="628" y="338" width="270" height="40" rx="8" fill="#fff" stroke="#64748b"/><text x="642" y="365" font-size="17" font-weight="400">[ ] [Canonical genre]</text><rect x="48" y="392" width="270" height="40" rx="8" fill="#fff" stroke="#64748b"/><text x="62" y="419" font-size="17" font-weight="400">[ ] [Canonical genre]</text><rect x="338" y="392" width="270" height="40" rx="8" fill="#fff" stroke="#64748b"/><text x="352" y="419" font-size="17" font-weight="400">[ ] [Canonical genre]</text><rect x="628" y="392" width="270" height="40" rx="8" fill="#fff" stroke="#64748b"/><text x="642" y="419" font-size="17" font-weight="400">[ ] [Canonical genre]</text><text x="48" y="475" font-size="16" font-weight="400">[Correction or retained-draft save error appears here]</text><rect x="48" y="500" width="220" height="36" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="60" y="524" font-size="16" font-weight="700">Save preferences</text><text x="28" y="608" font-size="17" font-weight="700">API calls (relative local backend paths)</text><text x="28" y="634" font-size="15" font-weight="400">GET /api/auth/me (guard when identity is unknown)</text><text x="28" y="657" font-size="15" font-weight="400">GET /api/genres · GET /api/me/preferences</text><text x="28" y="680" font-size="15" font-weight="400">PUT /api/me/preferences {genreIds: [1..5 distinct canonical IDs]}</text><text x="28" y="752" font-size="14" font-weight="400">Schematic labels in [brackets] denote data; verify exact UI wording in docs/ui.md.</text></g></svg>