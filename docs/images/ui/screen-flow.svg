<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1140" viewBox="0 0 1080 1140" role="img" aria-labelledby="t d"><title id="t">Updated M1 screen flow for M3</title><desc id="d">Solid paths are implemented. Dashed paths retain planned M1 routes and are not navigation or acceptance claims.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="1080" height="1140" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172033"><text x="36" y="40" font-size="24" font-weight="700">TEAM 03 / UPDATED M1 → M3 SCREEN FLOW</text><text x="36" y="74" font-size="17" font-weight="400">Solid: implemented navigation · Dashed: planned M1 entry; absent from current home</text><rect x="330" y="110" width="420" height="82" rx="8" fill="#fff" stroke="#64748b"/><text x="344" y="140" font-size="18" font-weight="700">/ · Public home</text><text x="344" y="169" font-size="16" font-weight="400">Start · Sign in · My recommendations</text><rect x="36" y="272" width="300" height="82" rx="8" fill="#fff" stroke="#64748b"/><text x="50" y="302" font-size="18" font-weight="700">/popular · Public P1</text><text x="50" y="331" font-size="16" font-weight="400">Popular movies; ≤10 ranked cards</text><rect x="390" y="272" width="300" height="82" rx="8" fill="#fff" stroke="#64748b"/><text x="404" y="302" font-size="18" font-weight="700">/login · Public</text><text x="404" y="331" font-size="16" font-weight="400">Sign in; success → recommendations</text><rect x="744" y="272" width="300" height="82" rx="8" fill="#fff" stroke="#64748b"/><text x="758" y="302" font-size="18" font-weight="700">/about-recommendations</text><text x="758" y="331" font-size="16" font-weight="400">Public explanation</text><rect x="390" y="440" width="300" height="82" rx="8" fill="#fff" stroke="#64748b"/><text x="404" y="470" font-size="18" font-weight="700">/register · Public</text><text x="404" y="499" font-size="16" font-weight="400">Create account; 201 → /login</text><rect x="36" y="440" width="300" height="82" rx="8" fill="#fff" stroke="#64748b"/><text x="50" y="470" font-size="18" font-weight="700">/movies/:movieId · Public</text><text x="50" y="499" font-size="16" font-weight="400">Details; authenticated rating widget</text><rect x="744" y="440" width="300" height="82" rx="8" fill="#fff" stroke="#64748b"/><text x="758" y="470" font-size="18" font-weight="700">/preferences · Protected</text><text x="758" y="499" font-size="16" font-weight="400">Select and save 1–5 genres</text><rect x="390" y="645" width="300" height="82" rx="8" fill="#fff" stroke="#64748b"/><text x="404" y="675" font-size="18" font-weight="700">/recommendations · Protected</text><text x="404" y="704" font-size="16" font-weight="400">Popular / personalised / no-match</text><rect x="36" y="846" width="400" height="82" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-dasharray="5 4"/><text x="50" y="876" font-size="18" font-weight="700">/search · PLANNED</text><text x="50" y="905" font-size="16" font-weight="400">No registered route; redirects to /</text><rect x="600" y="846" width="444" height="82" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-dasharray="5 4"/><text x="614" y="876" font-size="18" font-weight="700">/profile · Protected placeholder</text><text x="614" y="905" font-size="16" font-weight="400">Direct entry only; reset has API, no UI</text><path d="M330 151 H186 V272" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="68" y="208" font-size="15" font-weight="400">Popular movies</text><path d="M540 192 V272" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="552" y="230" font-size="15" font-weight="400">Sign in / guest Start</text><path d="M750 151 H894 V272" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="760" y="208" font-size="15" font-weight="400">How recommendations work</text><path d="M186 354 V440" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="198" y="398" font-size="15" font-weight="400">View details</text><path d="M390 313 H358 V604 H310 V522" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="66" y="588" font-size="15" font-weight="400">View details on home</text><path d="M500 354 V440" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="392" y="398" font-size="15" font-weight="400">Create account</text><path d="M590 440 V354" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="603" y="416" font-size="15" font-weight="400">201 / Sign in</text><path d="M690 313 H720 V623 H540 V645" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="728" y="568" font-size="15" font-weight="400">successful sign-in</text><path d="M750 175 H1060 V405 H930 V440" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="832" y="392" font-size="15" font-weight="400">Start (signed in)</text><path d="M690 686 H894 V522" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="720" y="641" font-size="15" font-weight="400">Enter / Change / Edit genres</text><path d="M830 522 V760 H640 V727" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="744" y="790" font-size="15" font-weight="400">Committed save / Back</text><path d="M390 686 H310 V522" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="115" y="663" font-size="15" font-weight="400">View details</text><path d="M336 490 H362 V709 H390" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="50" y="744" font-size="15" font-weight="400">Back to originating list</text><text x="36" y="565" font-size="15" font-weight="400">Detail returns: /, /popular or /recommendations.</text><text x="36" y="618" font-size="15" font-weight="400">Guest rating action → /login; no private rating calls.</text><path d="M360 192 H16 V887 H36" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="36" y="824" font-size="15" font-weight="400">M1 planned entry</text><path d="M750 130 H1070 V887 H1044" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="846" y="824" font-size="15" font-weight="400">M1 planned entry</text><text x="36" y="972" font-size="18" font-weight="400">Guard: unknown identity → GET /api/auth/me; no/expired/revoked session → /login.</text><text x="36" y="1006" font-size="17" font-weight="400">Sign out → /; account changes remount private state; old responses cannot replace new state.</text><text x="36" y="1040" font-size="17" font-weight="400">All movie lists open the opaque ID detail; only validated list return context is retained.</text><text x="36" y="1074" font-size="17" font-weight="400">Search/similarity, rating-adjusted ranking and full profile/reset UI are not completed M3 flows.</text><text x="36" y="1112" font-size="15" font-weight="400">Source: docs/screen-flow.puml; checked against App.tsx, guards and page links on merged M3 source.</text></g></svg>