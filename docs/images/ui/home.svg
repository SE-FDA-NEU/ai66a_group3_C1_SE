<svg xmlns="http://www.w3.org/2000/svg" width="960" height="770" viewBox="0 0 960 770" role="img" aria-labelledby="title desc"><title id="title">Public catalogue wireframe</title><desc id="desc">browse the local catalogue and start choosing movies.. Authored schematic, not a screenshot or acceptance evidence.</desc><rect width="960" height="770" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#172033"><text x="28" y="32" font-size="15" font-weight="700">M3 / TEAM 03  ·  WIREFRAME — NOT A SCREENSHOT</text><text x="28" y="67" font-size="26" font-weight="700">Public catalogue</text><text x="28" y="95" font-size="17" font-weight="400">/ · public</text><text x="28" y="126" font-size="17" font-weight="400">The user comes here to browse the local catalogue and start choosing movies.</text><rect x="24" y="170" width="912" height="412" rx="8" fill="#fff" stroke="#64748b"/><text x="48" y="205" font-size="14" font-weight="700">AI MOVIE RECOMMENDATION SYSTEM</text><text x="48" y="240" font-size="27" font-weight="700">Find your next movie</text><text x="48" y="270" font-size="17" font-weight="400">Browse the public local movie catalogue.</text><rect x="590" y="190" width="135" height="36" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="602" y="214" font-size="16" font-weight="700">Start</text><rect x="740" y="190" width="135" height="36" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="752" y="214" font-size="16" font-weight="700">Sign in</text><text x="510" y="255" font-size="16" font-weight="400">My recommendations · Popular movies</text><text x="510" y="282" font-size="16" font-weight="400">How recommendations work</text><rect x="48" y="320" width="270" height="170" rx="8" fill="#fff" stroke="#64748b"/><text x="62" y="346" font-size="15" font-weight="400">[Year]</text><text x="62" y="374" font-size="20" font-weight="700">[Movie title]</text><text x="62" y="400" font-size="16" font-weight="400">[Genres]</text><text x="62" y="426" font-size="15" font-weight="400">TMDb popularity [score]</text><text x="62" y="474" font-size="16" font-weight="700">View details</text><rect x="340" y="320" width="270" height="170" rx="8" fill="#fff" stroke="#64748b"/><text x="354" y="346" font-size="15" font-weight="400">[Year]</text><text x="354" y="374" font-size="20" font-weight="700">[Movie title]</text><text x="354" y="400" font-size="16" font-weight="400">[Genres]</text><text x="354" y="426" font-size="15" font-weight="400">TMDb popularity [score]</text><text x="354" y="474" font-size="16" font-weight="700">View details</text><rect x="632" y="320" width="270" height="170" rx="8" fill="#fff" stroke="#64748b"/><text x="646" y="346" font-size="15" font-weight="400">[Year]</text><text x="646" y="374" font-size="20" font-weight="700">[Movie title]</text><text x="646" y="400" font-size="16" font-weight="400">[Genres]</text><text x="646" y="426" font-size="15" font-weight="400">TMDb popularity [score]</text><text x="646" y="474" font-size="16" font-weight="700">View details</text><text x="28" y="608" font-size="17" font-weight="700">API calls (relative local backend paths)</text><text x="28" y="634" font-size="15" font-weight="400">GET /api/movies?limit=10</text><text x="28" y="752" font-size="14" font-weight="400">Schematic labels in [brackets] denote data; verify exact UI wording in docs/ui.md.</text></g></svg>