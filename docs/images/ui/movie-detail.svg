<svg xmlns="http://www.w3.org/2000/svg" width="960" height="770" viewBox="0 0 960 770" role="img" aria-labelledby="title desc"><title id="title">Movie detail wireframe</title><desc id="desc">read a selected movie and return to the originating list.. Authored schematic, not a screenshot or acceptance evidence.</desc><rect width="960" height="770" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#172033"><text x="28" y="32" font-size="15" font-weight="700">M3 / TEAM 03  ·  WIREFRAME — NOT A SCREENSHOT</text><text x="28" y="67" font-size="26" font-weight="700">Movie detail</text><text x="28" y="95" font-size="17" font-weight="400">/movies/:movieId · public; rating requires an account</text><text x="28" y="126" font-size="17" font-weight="400">The user comes here to read a selected movie and return to the originating list.</text><rect x="24" y="170" width="912" height="412" rx="8" fill="#fff" stroke="#64748b"/><text x="48" y="204" font-size="17" font-weight="400">← Back to recommendations / popular movies / catalogue</text><rect x="48" y="226" width="864" height="120" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="72" y="274" font-size="17" font-weight="400">[Backdrop with permanent contrast overlay, or gradient fallback]</text><text x="72" y="320" font-size="28" font-weight="700">[Movie title]</text><text x="48" y="385" font-size="17" font-weight="400">Year [year]     Genres [names]     TMDb popularity [score]</text><text x="48" y="425" font-size="21" font-weight="700">Overview</text><text x="48" y="457" font-size="17" font-weight="400">[Overview text, or Information unavailable for a null field]</text><text x="48" y="500" font-size="21" font-weight="700">Your rating</text><text x="48" y="535" font-size="17" font-weight="400">Guest: Sign in to rate this movie · Signed in: [1–5] [Save rating]</text><text x="28" y="608" font-size="17" font-weight="700">API calls (relative local backend paths)</text><text x="28" y="634" font-size="15" font-weight="400">GET /api/movies/{movieId} · GET /api/auth/me (rating identity check)</text><text x="28" y="657" font-size="15" font-weight="400">GET /api/me/ratings/{movieId} (authenticated only)</text><text x="28" y="680" font-size="15" font-weight="400">PUT /api/me/ratings/{movieId} {rating: integer 1..5} (save action only)</text><text x="28" y="752" font-size="14" font-weight="400">Schematic labels in [brackets] denote data; verify exact UI wording in docs/ui.md.</text></g></svg>