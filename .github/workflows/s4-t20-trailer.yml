name: S4 T20 trailer and backdrop acceptance

on:
  push:
    paths: ["backend/**", "frontend/**", "tests/**", ".github/workflows/s4-t20-trailer.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "tests/**", ".github/workflows/s4-t20-trailer.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trailer-backdrop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      TMDB_READ_ACCESS_TOKEN: ""
      TMDB_NETWORK_DISABLED: "1"
      S04_SQL_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked dependencies and Chromium
        run: |
          python -m pip install -r backend/requirements.lock.txt
          python -m pip install -e './backend[dev]' --no-deps
          npm --prefix frontend ci
          cd frontend
          npx playwright install --with-deps chromium
      - name: Verify P0, trailer selection, populated migration and media preservation
        run: python -m pytest -c pytest.ini tests backend/tests/test_trailer_enrichment.py backend/tests/test_trailer_all.py backend/tests/test_backdrop_acceptance.py backend/tests/test_image_enrichment_all.py backend/tests/test_tmdb_import_cli.py -q
      - name: Verify component safety and detail requests
        run: npm --prefix frontend test -- src/tests/movie-backdrop.test.tsx src/tests/movie-detail-return.test.tsx src/tests/movie-detail-rating.test.tsx
      - name: Verify T20 using real API, migrated SQLite and offline artwork
        run: npm --prefix frontend run test:t20:ui
      - name: Verify existing T01 regression and owned-database cleanup
        run: npm --prefix frontend run test:t01:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s4-t20-${{ github.sha }}
          path: |
            frontend/test-results/t20/
            frontend/test-results/t20-results.json
            frontend/test-results/t01/
            frontend/test-results/t01-results.json
          if-no-files-found: error
          retention-days: 14
