name: Scrum hygiene

# Teaching device, not bureaucracy: these checks make the *process* visible
# in the same place the code is. A failing check here is a conversation
# starter in the next stand-up, not a punishment.

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  linkage:
    name: PR is linked to a planned issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test issue-reference parsing
        run: node --test scripts/scrum-linkage.test.mjs
      - name: Check issue reference
        id: issue_refs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const title = pr.title || "";
            // Explicit references link partial delivery without closing unfinished work.
            // Anchor body directives so prose such as "does not close #136" cannot match.
            const references = [...body.matchAll(/^\s*(?:[-*]\s+)?(?:refs?|references?|relates\s+to|close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gim)];
            const titleRef = title.match(/^\[#(\d+)\]/);
            const issues = [...new Set([
              ...references.map(match => Number(match[1])),
              ...(titleRef ? [Number(titleRef[1])] : []),
            ])];
            if (issues.length === 0) {
              core.setFailed(
                "This pull request is not linked to a planned issue. " +
                "Use Refs #<number> for partial work or a [#<number>] title. " +
                "Use a closing directive only when the whole issue is complete."
              );
              return;
            }
            core.setOutput("issues", JSON.stringify(issues));
            core.info(`Linked planned issue(s): ${issues.join(", ")}`);

      - name: Check linked issue exists and has a type and owner
        uses: actions/github-script@v7
        env:
          LINKED_ISSUES: ${{ steps.issue_refs.outputs.issues }}
        with:
          script: |
            const issues = JSON.parse(process.env.LINKED_ISSUES || "[]");
            for (const num of issues) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: num
              });
              const labels = issue.labels.map(l => (typeof l === "string" ? l : l.name));
              if (!labels.some(l => ["story", "task", "bug", "chore", "spike"].includes(l))) {
                core.warning(
                  `Issue #${num} has none of the labels story / task / bug / chore / spike. ` +
                  `Untyped issues do not appear in the sprint report.`
                );
              }
              if (issue.assignees.length === 0) {
                core.warning(`Issue #${num} has nobody assigned. Who is doing this work?`);
              }
            }

  no_self_merge:
    name: Someone else must review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100
            });

            // A request or ordinary comment is not an approval. Branch protection
            // must also require approvals and dismiss stale reviews on new commits.
            const latest = new Map();
            for (const review of reviews) {
              if (review.user && review.user.login !== author &&
                  ["APPROVED", "CHANGES_REQUESTED", "DISMISSED"].includes(review.state)) {
                latest.set(review.user.login, review.state);
              }
            }
            const others = new Set([...latest].filter(([, state]) => state === "APPROVED").map(([login]) => login));

            if (others.size === 0) {
              core.setFailed(
                "No teammate approval is recorded yet. " +
                "Open the Reviewers menu on the right and pick someone who did not write this code. " +
                "Cross-review counts towards your individual mark."
              );
            } else {
              core.info(`Reviewers involved: ${[...others].join(", ")}`);
            }

  size:
    name: Pull request is reviewable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const churn = pr.additions + pr.deletions;

            if (churn > 1500) {
              core.warning(
                `This PR changes ${churn} lines across ${pr.changed_files} files. ` +
                `Nobody reviews that honestly - they click Approve. ` +
                `Split it, or expect questions at the demo about who wrote what.`
              );
            }
            if (pr.commits === 1 && churn > 600) {
              core.warning(
                "One commit, hundreds of lines. This looks like work that was done " +
                "offline and pushed in a single dump. Commit as you go instead - " +
                "commit history is 25% of Milestone 3."
              );
            }
