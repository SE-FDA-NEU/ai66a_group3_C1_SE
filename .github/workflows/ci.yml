name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - develop

# Cancel an older run when a newer commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect stack
    runs-on: ubuntu-latest

    outputs:
      python: ${{ steps.check.outputs.python }}
      node: ${{ steps.check.outputs.node }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect project stack
        id: check
        shell: bash
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f frontend/package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi


  python:
    name: Python tests
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./data/app.db
      TMDB_READ_ACCESS_TOKEN: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"

      - name: Create local data directory
        run: mkdir -p data

      - name: Run database migrations
        run: |
          python -m alembic \
            -c backend/alembic.ini \
            upgrade head

      - name: Lint backend
        run: |
          ruff check backend --output-format=github

      - name: Run backend tests
        run: |
          python -m pytest backend/tests \
            -v \
            --cov=backend/app \
            --cov-report=term-missing \
            --junitxml=junit.xml

      - name: Publish test summary
        if: always()
        run: |
          echo "### Python test results" >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path("junit.xml")

          if not report.exists():
              print("No test report produced. The test run may have crashed.")
          else:
              root = ET.parse(report).getroot()

              if root.tag == "testsuite":
                  suites = [root]
              else:
                  suites = root.findall("testsuite")

              total = sum(int(s.get("tests", 0)) for s in suites)
              failures = sum(int(s.get("failures", 0)) for s in suites)
              errors = sum(int(s.get("errors", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)

              print(f"- Tests run: **{total}**")
              print(f"- Failed: **{failures + errors}**")
              print(f"- Skipped: **{skipped}**")
          PY


  node:
    name: Node build and tests
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build


  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for obvious credentials
        shell: bash
        run: |
          PATTERN='(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'

          if git grep -nIE "$PATTERN" -- \
            . \
            ':!*.md' \
            ':!.github/workflows/*'
          then
            echo "::error::A credential-looking string was found."
            echo "::error::Move secrets to environment variables and rotate exposed credentials."
            exit 1
          fi

          echo "No obvious credentials found."

      - name: Check forbidden files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.sql$|\.sqlite$|\.sqlite3$|\.dump$'
          then
            echo "::error::Environment files or database dumps must not be committed."
            exit 1
          fi

          echo "No forbidden environment or database files found."