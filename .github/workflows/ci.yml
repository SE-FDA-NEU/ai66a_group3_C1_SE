name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

# Cancel an older run when a newer commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect stack
    runs-on: ubuntu-latest

    outputs:
      storage: ${{ steps.check.outputs.storage }}
      bootstrap: ${{ steps.check.outputs.bootstrap }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect focused storage and test-bootstrap changes
        id: check
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          base = os.environ.get("DIFF_BASE", "")
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              changed = set()
          elif base and set(base) != {"0"} and subprocess.run(
              ["git", "cat-file", "-e", base], capture_output=True
          ).returncode == 0:
              changed = set(subprocess.check_output(
                  ["git", "diff", "--name-only", base, "HEAD"], text=True
              ).splitlines())
          else:
              # New branches or an unavailable pre-force-push commit: run only
              # the small focused suites, never fall back to the full backend.
              changed = set(subprocess.check_output(
                  ["git", "ls-files"], text=True
              ).splitlines())
          test_config = {"pytest.ini", "conftest.py", "backend/pyproject.toml"}
          storage = test_config | {
              "backend/app/cli/storage_snapshot.py",
              "backend/tests/test_storage_snapshot.py",
          }
          bootstrap = test_config | {"tests/test_pytest_setup.py"}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, paths in (("storage", storage), ("bootstrap", bootstrap)):
                  print(f"{name}={str(bool(changed & paths)).lower()}", file=output)
          PY


  python:
    name: Python tests
    needs: detect
    runs-on: ubuntu-latest

    env:
      TMDB_READ_ACCESS_TOKEN: ""
      TMDB_NETWORK_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock.txt
          python -m pip install -e "./backend[dev]" --no-deps

      - name: Lint backend
        run: |
          ruff check backend --output-format=github

      - name: Run mandatory M4 P0 with automatic temporary database setup
        run: python -m pytest -v --junitxml=junit.xml

      - name: Verify S4-T05 P0 traceability
        run: python scripts/verify_s4_t05_trace.py

      - name: Verify regional provider enrichment and CLI offline
        run: python -m pytest -c pytest.ini backend/tests/test_provider_enrichment.py backend/tests/test_regional_providers.py backend/tests/test_tmdb_import_cli.py -v

      - name: Verify affected backup and restore paths
        if: needs.detect.outputs.storage == 'true'
        run: python -m pytest -c pytest.ini backend/tests/test_storage_snapshot.py -v

      - name: Verify affected early pytest bootstrap
        if: needs.detect.outputs.bootstrap == 'true'
        run: python -m pytest -c pytest.ini tests/test_pytest_setup.py -v

      - name: Verify production serving, health and sessions offline
        run: python -m pytest -c pytest.ini backend/tests/test_health.py backend/tests/test_production_serving.py backend/tests/test_auth_sessions.py -v

      - name: Publish test summary
        if: always()
        run: |
          echo "### Mandatory M4 P0 test results" >> "$GITHUB_STEP_SUMMARY"
          echo "Optional full Python regression: not run. Use the Optional extended regression workflow." >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path("junit.xml")

          if not report.exists():
              print("No test report produced. The test run may have crashed.")
          else:
              root = ET.parse(report).getroot()

              if root.tag == "testsuite":
                  suites = [root]
              else:
                  suites = root.findall("testsuite")

              total = sum(int(s.get("tests", 0)) for s in suites)
              failures = sum(int(s.get("failures", 0)) for s in suites)
              errors = sum(int(s.get("errors", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)

              print(f"- Tests run: **{total}**")
              print(f"- Failed: **{failures + errors}**")
              print(f"- Skipped: **{skipped}**")
          PY


  postgresql:
    name: PostgreSQL 18 integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: movie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d movie_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://ci:disposable-ci-only@127.0.0.1:5432/movie_test?sslmode=disable&connect_timeout=5
      TEST_POSTGRES_MAJOR: "18"
      REQUIRE_POSTGRES_TESTS: "1"
      TMDB_READ_ACCESS_TOKEN: ""
      TMDB_NETWORK_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements.lock.txt
          python -m pip install -e './backend[dev]' --no-deps
      - name: Verify PostgreSQL migrations, storage and account isolation
        run: python -m pytest -c pytest.ini backend/tests/test_postgresql_t01.py -v --junitxml=postgresql.xml
      - name: Require integration execution without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("postgresql.xml").findall(".//testcase")
          required = {
              "test_empty_postgresql_migration_schema_constraints_and_provisioning",
              "test_postgresql_rating_migration_keeps_identity",
              "test_postgresql_api_isolation_reset_and_catalogue_pages",
              "test_postgresql_account_lock_and_catalogue_snapshot",
          }
          assert required <= {case.attrib["name"] for case in cases}, "DB tests did not execute"
          assert all(len(case) == 0 for case in cases), "DB checks must pass without skips"
          PY

      - name: Install matching PostgreSQL 18 recovery clients
        run: |
          if [ ! -x /usr/lib/postgresql/18/bin/pg_dump ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get update
            sudo apt-get install --yes postgresql-client-18
          fi
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Rehearse isolated native recovery and comparator refusals
        env:
          RECOVERY_TEST_SOURCE_URL: postgresql+psycopg://ci:disposable-ci-only@127.0.0.1:5432/s5_t06_ci_source?sslmode=disable&connect_timeout=5
          RECOVERY_TEST_TARGET_URL: postgresql+psycopg://ci:disposable-ci-only@127.0.0.1:5432/s5_t06_ci_target?sslmode=disable&connect_timeout=5
        run: |
          python - <<'PY'
          import os
          import psycopg
          from psycopg import sql
          from sqlalchemy.engine import make_url
          for variable in ("RECOVERY_TEST_SOURCE_URL", "RECOVERY_TEST_TARGET_URL"):
              url = make_url(os.environ[variable])
              with psycopg.connect(host=url.host, port=url.port, user=url.username,
                                  password=url.password, dbname="movie_test",
                                  autocommit=True) as connection:
                  connection.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(url.database)))
          PY
          python -m pytest -c pytest.ini backend/tests/test_s5_t06_postgres_recovery.py -v --junitxml=recovery.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("recovery.xml").findall(".//testcase")
          assert len(cases) >= 5, "Focused recovery cases did not execute"
          assert all(len(case) == 0 for case in cases), "Recovery cases must pass without skips"
          PY

  node:
    name: Node build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Report optional frontend test scope
        if: always()
        run: |
          echo "### Frontend validation scope" >> "$GITHUB_STEP_SUMMARY"
          echo "Lint and build are automatic; see their step results above." >> "$GITHUB_STEP_SUMMARY"
          echo "Optional full Vitest and browser regressions: not run. Dispatch Optional extended regression or the individual feature workflows to run them." >> "$GITHUB_STEP_SUMMARY"


  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for obvious credentials
        shell: bash
        run: |
          PATTERN='(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'

          if git grep -nIE "$PATTERN" -- \
            . \
            ':!.github/workflows/*'
          then
            echo "::error::A credential-looking string was found."
            echo "::error::Move secrets to environment variables and rotate exposed credentials."
            exit 1
          fi

          echo "No obvious credentials found."

      - name: Check forbidden files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.db$|\.sql$|\.sqlite$|\.sqlite3$|\.dump$'
          then
            echo "::error::Environment files or database dumps must not be committed."
            exit 1
          fi

          echo "No forbidden environment or database files found."
