name: T16 UI and database acceptance

on:
  push:
    branches: ["**"]
    paths: ["backend/**", "frontend/**", ".github/workflows/t16-integration.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["backend/**", "frontend/**", ".github/workflows/t16-integration.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMDB_READ_ACCESS_TOKEN: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the locked test runtimes
        run: |
          python -m pip install -r backend/requirements.lock.txt
          python -m pip install -e "./backend[dev]" --no-deps
          npm --prefix frontend ci
      - name: Verify React filter actions against real API and committed SQLite
        run: npm --prefix frontend run test:t16:integration
