name: T13 profile acceptance

# Optional extended regression: Run workflow is the explicit opt-in.
# Keep existing workflow/job names and test steps for manual runs.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-acceptance:
    runs-on: ubuntu-24.04
    env:
      TMDB_READ_ACCESS_TOKEN: ""
      TMDB_NETWORK_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements.lock.txt
          python -m pip install -e './backend[dev]' --no-deps
          npm --prefix frontend ci
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify profile journeys on isolated SQLite
        run: npm --prefix frontend run test:t13:ui
      - name: Upload result summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t13-profile-results
          path: frontend/test-results/t13-results.json
          if-no-files-found: warn
      - name: Verify full reset acceptance (T15) on isolated SQLite
        if: ${{ !cancelled() }}
        run: npm --prefix frontend run test:t15:ui
      - name: Upload T15 result summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: t15-reset-acceptance-results
          path: frontend/test-results/t15-results.json
          if-no-files-found: error
      - name: Upload T15 failure output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: t15-reset-acceptance-failures
          path: frontend/test-results/t15/
          if-no-files-found: warn
          retention-days: 14
